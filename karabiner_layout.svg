<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background with rounded corners -->
  <rect width="800" height="400" fill="#f8f0f4" rx="20" ry="20"/>
  
  <!-- Define styles for consistent key appearance -->
  <defs>
    <style>
      .key { rx: 6; ry: 6; }
      .key-text { font-family: Arial; font-size: 12px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
      .arrow-text { font-family: Arial; font-size: 12px; fill: #333; text-anchor: middle; dominant-baseline: middle; }
      .green-key { fill: #98d1a1; }
      .yellow-key { fill: #f7d794; }
      .orange-key { fill: #f5b971; }
      .grey-key { fill: #b8c2cc; }
      .pink-key { fill: #f4a9b7; }
      .red-key { fill: #e17b77; }
    </style>
  </defs>

  <!-- Number Row -->
  <g transform="translate(50, 50)">
    <rect class="key green-key" x="0" y="0" width="40" height="40"/>
    <text class="key-text" x="20" y="20">`</text>
    
    <rect class="key green-key" x="45" y="0" width="40" height="40"/>
    <text class="key-text" x="65" y="20">1</text>
    
    <rect class="key yellow-key" x="90" y="0" width="40" height="40"/>
    <text class="key-text" x="110" y="20">2</text>
    
    <rect class="key orange-key" x="135" y="0" width="40" height="40"/>
    <text class="key-text" x="155" y="20">3</text>
    
    <rect class="key grey-key" x="180" y="0" width="40" height="40"/>
    <text class="key-text" x="200" y="20">4</text>
    
    <rect class="key grey-key" x="225" y="0" width="40" height="40"/>
    <text class="key-text" x="245" y="20">5</text>
    
    <rect class="key pink-key" x="270" y="0" width="40" height="40"/>
    <text class="key-text" x="290" y="20">6</text>
    
    <rect class="key pink-key" x="315" y="0" width="40" height="40"/>
    <text class="key-text" x="335" y="20">7</text>
    
    <rect class="key yellow-key" x="360" y="0" width="40" height="40"/>
    <text class="key-text" x="380" y="20">8</text>
    
    <rect class="key yellow-key" x="405" y="0" width="40" height="40"/>
    <text class="key-text" x="425" y="20">9</text>
    
    <rect class="key green-key" x="450" y="0" width="40" height="40"/>
    <text class="key-text" x="470" y="20">0</text>
    
    <rect class="key green-key" x="495" y="0" width="40" height="40"/>
    <text class="key-text" x="515" y="20">-</text>
    
    <rect class="key green-key" x="540" y="0" width="40" height="40"/>
    <text class="key-text" x="560" y="20">=</text>
    
    <rect class="key green-key" x="585" y="0" width="80" height="40"/>
    <text class="key-text" x="625" y="20">&#x232B;</text>
  </g>

  <!-- QWERTY Row -->
  <g transform="translate(50, 95)">
    <rect class="key green-key" x="0" y="0" width="60" height="40"/>
    <text class="key-text" x="30" y="20">Tab</text>
    
    <rect class="key green-key" x="65" y="0" width="40" height="40"/>
    <text class="key-text" x="85" y="20">)</text>
    
    <rect class="key yellow-key" x="110" y="0" width="40" height="40"/>
    <text class="key-text" x="130" y="20">]</text>
    
    <rect class="key orange-key" x="155" y="0" width="40" height="40"/>
    <text class="key-text" x="175" y="20">}</text>
    
    <rect class="key grey-key" x="200" y="0" width="40" height="40"/>
    <text class="key-text" x="220" y="20">R</text>
    
    <rect class="key grey-key" x="245" y="0" width="40" height="40"/>
    <text class="key-text" x="265" y="20">T</text>
    
    <rect class="key pink-key" x="290" y="0" width="40" height="40"/>
    <text class="key-text" x="310" y="20">Y</text>
    
    <rect class="key pink-key" x="335" y="0" width="40" height="40"/>
    <text class="key-text" x="355" y="20">U</text>
    
    <rect class="key yellow-key" x="380" y="0" width="40" height="40"/>
    <text class="arrow-text" x="400" y="20">↑</text>
    
    <rect class="key yellow-key" x="425" y="0" width="40" height="40"/>
    <text class="key-text" x="445" y="20">=</text>
    
    <rect class="key green-key" x="470" y="0" width="40" height="40"/>
    <text class="key-text" x="490" y="20"> ; ↩</text>
    
    <rect class="key green-key" x="515" y="0" width="40" height="40"/>
    <text class="key-text" x="535" y="20">&lt;</text>
    
    <rect class="key green-key" x="560" y="0" width="40" height="40"/>
    <text class="key-text" x="580" y="20">]</text>
    
    <rect class="key green-key" x="605" y="0" width="60" height="40"/>
    <text class="key-text" x="635" y="20">\</text>
  </g>

  <!-- Home Row -->
  <g transform="translate(50, 140)">
    <rect class="key green-key" x="0" y="0" width="75" height="40"/>
    <text class="key-text" x="37.5" y="20">Extend</text>
    
    <rect class="key green-key" x="80" y="0" width="40" height="40"/>
    <text class="key-text" x="100" y="20">(</text>
    
    <rect class="key yellow-key" x="125" y="0" width="40" height="40"/>
    <text class="key-text" x="145" y="20">[</text>
    
    <rect class="key orange-key" x="170" y="0" width="40" height="40"/>
    <text class="key-text" x="190" y="20">{</text>
    
    <rect class="key grey-key" x="215" y="0" width="40" height="40"/>
    <text class="key-text" x="235" y="20">F</text>
    
    <rect class="key grey-key" x="260" y="0" width="40" height="40"/>
    <text class="key-text" x="280" y="20">G</text>
    
    <rect class="key pink-key" x="305" y="0" width="40" height="40"/>
    <text class="key-text" x="325" y="20">&#x21E4;</text>
    
    <rect class="key pink-key" x="350" y="0" width="40" height="40"/>
    <text class="arrow-text" x="370" y="20">←</text>
    
    <rect class="key yellow-key" x="395" y="0" width="40" height="40"/>
    <text class="arrow-text" x="415" y="20">↓</text>
    
    <rect class="key yellow-key" x="440" y="0" width="40" height="40"/>
    <text class="arrow-text" x="460" y="20">→</text>
    
    <rect class="key green-key" x="485" y="0" width="40" height="40"/>
    <text class="key-text" x="505" y="20">&#x21E5;</text>
    
    <rect class="key green-key" x="530" y="0" width="40" height="40"/>
    <text class="key-text" x="550" y="20">&#x232B;</text>
    
    <rect class="key green-key" x="575" y="" width="90" height="40"/>
    <text class="key-text" x="620" y="20">Enter</text>
  </g>

  <!-- Bottom Row -->
  <g transform="translate(50, 185)">
    <rect class="key green-key" x="0" y="0" width="90" height="40"/>
    <text class="key-text" x="45" y="20">&#x21E7;</text>
    
    <rect class="key green-key" x="95" y="0" width="40" height="40"/>
    <text class="key-text" x="115" y="20">&#x21BA;</text>
    
    <rect class="key yellow-key" x="140" y="0" width="40" height="40"/>
    <text class="key-text" x="160" y="20">&#x21BB;</text>
    
    <rect class="key orange-key" x="185" y="0" width="40" height="40"/>
    <text class="key-text" x="205" y="20">⌘c</text>
    
    <rect class="key grey-key" x="230" y="0" width="40" height="40"/>
    <text class="key-text" x="250" y="20">⌘v</text>
    
    <rect class="key grey-key" x="275" y="0" width="40" height="40"/>
    <text class="key-text" x="295" y="20">B</text>
    
    <rect class="key pink-key" x="320" y="0" width="40" height="40"/>
    <text class="key-text" x="340" y="20">`</text>
    
    <rect class="key pink-key" x="365" y="0" width="40" height="40"/>
    <text class="key-text" x="385" y="20">M</text>
    
    <rect class="key yellow-key" x="410" y="0" width="40" height="40"/>
    <text class="key-text" x="430" y="20">,</text>
    
    <rect class="key yellow-key" x="455" y="0" width="40" height="40"/>
    <text class="key-text" x="475" y="20">.</text>
    
    <rect class="key green-key" x="500" y="0" width="40" height="40"/>
    <text class="key-text" x="520" y="20">/</text>
    
    <rect class="key green-key" x="545" y="0" width="120" height="40"/>
    <text class="key-text" x="605" y="20">&#x21E7;</text>
  </g>

  <!-- Bottom Row -->
  <g transform="translate(50, 230)">
    <rect class="key green-key" x="0" y="0" width="45" height="40"/>
    <text class="key-text" x="22.5" y="20">fn</text>
    
    <rect class="key green-key" x="50" y="0" width="45" height="40"/>
    <text class="key-text" x="72.5" y="20">^</text>
    
    <rect class="key green-key" x="100" y="0" width="45" height="40"/>
    <text class="key-text" x="122.5" y="20">&#x2325;</text>
    
    <rect class="key green-key" x="150" y="0" width="45" height="40"/>
    <text class="key-text" x="172.5" y="20">⌘</text>
    
    <rect class="key red-key" x="200" y="0" width="300" height="40"/>
    <text class="key-text" x="350" y="20">Space</text>
    
    <rect class="key green-key" x="505" y="0" width="45" height="40"/>
    <text class="key-text" x="527.5" y="20">⌘</text>
    
    <rect class="key green-key" x="555" y="0" width="45" height="40"/>
    <text class="key-text" x="577.5" y="20">&#x2325;</text>
    
    <rect class="key green-key" x="605" y="0" width="45" height="40"/>
    <text class="key-text" x="627.5" y="20"> </text>
    
  </g>

  <!-- Add key homing marks -->

  <line x1="280" y1="183" x2="290" y2="183" stroke="#666" stroke-width="1" stroke-opacity="0.9"/>
  
  <!-- Minimal underline for J key (now mapped to left arrow) -->
  <line x1="415" y1="183" x2="425" y2="183" stroke="#666" stroke-width="1" stroke-opacity="0.9"/>
</svg>